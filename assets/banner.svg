<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Text Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Effects */
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.15; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 1000px 220px; }
    .scan-beam { animation: scanline 6s linear infinite; }
    .particle { animation: floatParticle 5s ease-in-out infinite; }
  </style>

  <!-- Base Layer: Background -->
  <rect width="1200" height="320" fill="url(#bg-gradient)" rx="12" />

  <!-- Layer 2: Grid Overlay -->
  <rect width="1200" height="320" fill="url(#grid)" rx="12" />

  <!-- Layer 3: Dynamic Glowing Background Orbs (Behind Text) -->
  <circle class="orb-1" cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-2" cx="1000" cy="220" r="200" fill="#a855f7" opacity="0.25" filter="url(#glow)" />

  <!-- Layer 4: Dynamic Floating Particles (Background) -->
  <circle class="particle" cx="150" cy="240" r="3" fill="#38bdf8" opacity="0.6" />
  <circle class="particle" cx="1050" cy="80" r="4" fill="#c084fc" opacity="0.6" />
  <circle class="particle" cx="600" cy="40" r="2.5" fill="#818cf8" opacity="0.5" />

  <!-- Layer 5: Dynamic Scan Line (Background) -->
  <line class="scan-beam" x1="0" y1="0" x2="1200" y2="0" stroke="url(#accent-gradient)" stroke-width="2" opacity="0.2" />

  <!-- Layer 6: Decorative Border Lines -->
  <rect x="2" y="2" width="1196" height="316" fill="none" stroke="url(#accent-gradient)" stroke-width="1.5" rx="10" opacity="0.4" />
  <line x1="100" y1="265" x2="1100" y2="265" stroke="url(#accent-gradient)" stroke-width="2" opacity="0.8" />

  <!-- Layer 7: FOREGROUND TEXT & CONTENT (Ensured Top Priority) -->
  <g text-anchor="middle">
    <!-- Top Badge / Category -->
    <rect x="475" y="42" width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="600" y="61" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">
      SHIFT-LEFT DEV &amp; SEC
    </text>

    <!-- Main Title -->
    <text x="600" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Automated Code Quality
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" fill="url(#text-gradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1">
      Static Analysis • SAST • Linters • Code Quality Gates • SCA
    </text>

    <!-- Bottom Tagline -->
    <text x="600" y="242" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
      ⚡ Curated Enterprise Platforms &amp; Open-Source Engines
    </text>
  </g>
</svg>
